<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta | GTools Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('theme')) || 'dark'; } catch (e) {}</script>
  <script src="js/profile.js" defer></script>
</head>
<body class="profile-page">
  <header class="top profile-header">
    <a class="brand" href="index.html">GTools Academy</a>
    <a class="ghost" href="index.html" data-i18n="back"></a>
  </header>
  <main class="profile-main">
    <section class="profile-card card">
      <span class="section-kicker" data-i18n="account"></span>
      <h1 data-i18n="title"></h1>
      <p class="note" data-i18n="intro"></p>
      <p id="profile-status" class="note" role="status" aria-live="polite"></p>

      <div id="profile-details" class="profile-details" hidden>
        <div class="profile-identity">
          <img id="profile-avatar" alt="" hidden>
          <span id="profile-initials" class="profile-initials" aria-hidden="true"></span>
          <div>
            <h2 id="profile-name"></h2>
            <p id="profile-email" class="note"></p>
          </div>
        </div>
        <button id="profile-signout" class="ghost" type="button" data-i18n="logout"></button>
      </div>

      <div id="profile-signed-out" hidden>
        <a class="solid" href="api/auth.php?action=login" data-i18n="login"></a>
      </div>

      <div class="profile-preferences">
        <h2 data-i18n="preferences"></h2>
        <label>
          <span data-i18n="language"></span>
          <select id="profile-language">
            <option value="es" data-i18n="spanish"></option>
            <option value="en" data-i18n="english"></option>
          </select>
        </label>
        <label>
          <span data-i18n="theme"></span>
          <select id="profile-theme">
            <option value="dark" data-i18n="dark"></option>
            <option value="light" data-i18n="light"></option>
          </select>
        </label>
      </div>
      <p id="preferences-status" class="note" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
